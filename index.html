<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/byou-mark.svg" />
    <!-- viewport-fit=cover habilita as env(safe-area-inset-*), usadas pela
         BottomNav para não ficar sob a barra de gestos do iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Pinta a barra do navegador no mobile com o fundo do app (surface-0 de
         cada tema); sem isto ela fica branca sobre uma interface escura. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e12" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5fa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Byou &mdash; streaming</title>
    <!-- Descrição e Open Graph: sem estes, o link compartilhado (o botão
         "Compartilhar" da página do vídeo existe e é usado) aparece no
         WhatsApp/Telegram/X como uma URL crua, sem título nem imagem.
         Valores estáticos porque isto é uma SPA: o HTML servido é o mesmo para
         toda rota, então o crawler nunca vê o título do vídeo específico.
         Preview por vídeo exige SSR ou pré-render — não é o caso hoje. -->
    <meta
      name="description"
      content="Byou é uma plataforma de streaming onde criadores publicam seus vídeos e o público descobre, comenta e avalia."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Byou" />
    <meta property="og:title" content="Byou — streaming" />
    <meta
      property="og:description"
      content="Publique, descubra e avalie vídeos de criadores independentes."
    />
    <meta property="og:image" content="/byou-logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
